# X2 heuristic planner — bin specification.
#
# Source of truth for what motion primitives the planner needs and the
# tolerance bands the curator scores against. Hand-edited.
#
# Companion files (curator-written):
#   - x2_planner_primitives.yaml            (selected clip per bin)
#   - x2_planner_primitives.pkl             (actual sliced motion data)
#   - x2_planner_primitives_report.md       (top-N candidates per bin)
#
# Distance conversions:
#     1 ft   = 0.3048 m
#     0.5 ft = 0.1524 m
#     0.25ft = 0.0762 m
#
# Tolerance bands track the design in the planner plan:
#   docs/source/references/x2_heuristic_planner.md
#
# All target_xy_m entries are body-frame [forward_m, lateral_m] (lateral is
# positive to the robot's left). All angles are in degrees. Pelvis-z band is
# in meters (root joint world z).
#
# `name_regex` is a *soft* accelerator over motion_key strings — used to
# pre-filter candidates before the metric scorer evaluates them. Leave
# unset to scan every clip in the source PKL (slower but always works).

bins:
  # =====================================================================
  # IDLE — always-on rest loop
  # =====================================================================
  - name: idle_stand
    family: idle
    target_intent: idle
    target_magnitude: default
    target_xy_m: [0.0, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.04
    tol_yaw_deg: 3.0
    cross_axis_max_m: 0.04
    pelvis_z_band_m: [0.70, 0.80]
    end_at_square_min: 0.5
    feet_planted_min: 0.5
    stride_count_target: 0
    window_frames_min: 45
    window_frames_max: 150
    name_regex: "(?i)(idle|stand|rest|stationary)"

  # =====================================================================
  # CONTINUOUS WALK — distance gait (entry/exit blended on demand)
  # =====================================================================
  - name: fwd_walk_standard
    family: continuous_walk
    target_intent: walk
    target_magnitude: forward
    target_xy_m: [0.50, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.20
    tol_yaw_deg: 8.0
    cross_axis_max_m: 0.10
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.0
    stride_count_target: null
    window_frames_min: 90
    window_frames_max: 180
    name_regex: "(?i)(walk|stride|pace|gait)"

  - name: back_walk_standard
    family: continuous_walk
    target_intent: walk
    target_magnitude: backward
    target_xy_m: [-0.50, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.20
    tol_yaw_deg: 8.0
    cross_axis_max_m: 0.10
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.0
    stride_count_target: null
    window_frames_min: 90
    window_frames_max: 180
    name_regex: "(?i)(walk_backward|reverse|retreat|back_step)"

  # =====================================================================
  # FORWARD SHUFFLES — single-step, end at square stance
  # =====================================================================
  - name: fwd_step_1ft
    family: locomotion
    target_intent: fwd_step
    target_magnitude: one_ft
    target_xy_m: [0.3048, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.06
    tol_yaw_deg: 4.0
    cross_axis_max_m: 0.05
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1     # require at least one real foot-lift
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(step|walk|stride|shuffle|stop)"

  - name: fwd_step_half_ft
    family: locomotion
    target_intent: fwd_step
    target_magnitude: half_ft
    target_xy_m: [0.1524, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.05
    tol_yaw_deg: 4.0
    cross_axis_max_m: 0.05
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1     # was selecting body-sway clips with strides=0
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(step|walk|stride|shuffle|approach)"

  - name: fwd_step_quarter_ft
    family: locomotion
    target_intent: fwd_step
    target_magnitude: quarter_ft
    target_xy_m: [0.0762, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.04
    tol_yaw_deg: 4.0
    cross_axis_max_m: 0.04
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1
    window_frames_min: 25
    window_frames_max: 75
    name_regex: "(?i)(step|walk|stride|shuffle|nudge)"

  # =====================================================================
  # BACKWARD SHUFFLES
  # =====================================================================
  - name: back_step_half_ft
    family: locomotion
    target_intent: back_step
    target_magnitude: half_ft
    target_xy_m: [-0.1524, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.05
    tol_yaw_deg: 4.0
    cross_axis_max_m: 0.05
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(back|reverse|retreat|step|shuffle)"

  - name: back_step_quarter_ft
    family: locomotion
    target_intent: back_step
    target_magnitude: quarter_ft
    target_xy_m: [-0.0762, 0.0]
    target_yaw_deg: 0.0
    tol_xy_m: 0.04
    tol_yaw_deg: 4.0
    cross_axis_max_m: 0.04
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1     # was selecting sway clips with strides=0
    window_frames_min: 25
    window_frames_max: 75
    name_regex: "(?i)(back|reverse|step|shuffle)"

  # =====================================================================
  # LATERAL SHUFFLES
  # =====================================================================
  # Single canonical side-step per direction. The original mocap source
  # was a back-right diagonal at ~45 deg of ~37 cm total (28 cm back +
  # 25 cm right). 0.5x scaled variants were untrackable by the policy;
  # 2x scaled variants exceed the policy's tracking envelope. Any
  # magnitude token from the (side_left|side_right) intent collapses to
  # this single bin. The demo bank has no lateral-step clip, so these
  # bins have no recipe until you pin one from your own corpus
  # (x2_planner_primitives_recipes.yaml).
  - name: side_left_step
    family: locomotion
    # Derived from side_right_step via mirror_lr; both bins are
    # the user-approved A038_M [0, 90] window (see recipes YAML's
    # source_ref.approved_bake_pkl for the original SONIC playback
    # the user blessed on 2026-05-11).
    target_intent: side_left
    target_magnitude: default
    target_xy_m: [-0.25, 0.27]
    target_yaw_deg: 0.0
    tol_xy_m: 0.10
    tol_yaw_deg: 8.0
    cross_axis_max_m: 0.10
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1
    window_frames_min: 60
    window_frames_max: 120
    name_regex: "(?i)(side|sidestep|lateral|shuffle|crab|left)"

  - name: side_right_step
    family: locomotion
    # User-approved A038_M [0, 90] window (see recipes YAML's
    # source_ref.approved_bake_pkl for the original SONIC playback
    # the user blessed on 2026-05-11).
    target_intent: side_right
    target_magnitude: default
    target_xy_m: [-0.25, -0.27]
    target_yaw_deg: 0.0
    tol_xy_m: 0.10
    tol_yaw_deg: 8.0
    cross_axis_max_m: 0.10
    pelvis_z_band_m: [0.62, 0.80]
    end_at_square_min: 0.4
    stride_count_target: 1
    stride_count_min: 1
    window_frames_min: 60
    window_frames_max: 120
    name_regex: "(?i)(side|sidestep|lateral|shuffle|crab|right)"

  # =====================================================================
  # IN-PLACE TURNS — pivot left
  # =====================================================================
  - name: turn_left_15deg
    family: locomotion
    target_intent: turn_left
    target_magnitude: deg_15
    target_xy_m: [0.0, 0.0]
