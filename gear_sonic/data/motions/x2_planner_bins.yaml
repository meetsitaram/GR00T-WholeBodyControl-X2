  # =====================================================================
  # STATIC UPPER-BODY — feet planted, end-at-apex (held)
  #
  # All bins below set ``freeze_arms_to_default: true``. The curated PKL is
  # written with arm + head DOFs forced to DEFAULT_STAND_POSE_MUJOCO_RAD so
  # the planner only commands waist/torso. Arms are owned downstream by the
  # VLA / teleop source (mock_vla_publish_stand_token / Quest3 IK / etc.).
  # =====================================================================
  # Forward leans: synth in v6 (waist_pitch + 0.30 hip_pitch_share). The
  # peak waist angle is HARD-CAPPED at 20 deg inside
  # op_synthesize_waist_ramp; magnitudes here mirror the cap (8 / 14 / 20).
  - name: lean_fwd_small
    family: static_upper_body
    target_intent: lean_fwd
    target_magnitude: small
    target_waist_pitch_deg: 8.0
    tol_waist_deg: 3.0
    pelvis_z_band_m: [0.70, 0.80]
    end_at_apex_min: 0.7
    feet_planted_min: 0.4
    stride_count_target: 0
    freeze_arms_to_default: true
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(lean|bend|reach|forward|pickup|pick)"

  - name: lean_fwd_medium
    family: static_upper_body
    target_intent: lean_fwd
    target_magnitude: medium
    target_waist_pitch_deg: 14.0
    tol_waist_deg: 5.0
    pelvis_z_band_m: [0.68, 0.80]
    end_at_apex_min: 0.7
    feet_planted_min: 0.4
    stride_count_target: 0
    freeze_arms_to_default: true
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(lean|bend|reach|forward|pickup|pick|stoop)"

  - name: lean_fwd_large
