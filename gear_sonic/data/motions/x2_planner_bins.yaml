    target_magnitude: large
    target_waist_pitch_deg: 20.0
    tol_waist_deg: 6.0
    pelvis_z_band_m: [0.66, 0.80]
    end_at_apex_min: 0.7
    feet_planted_min: 0.4
    stride_count_target: 0
    freeze_arms_to_default: true
    window_frames_min: 30
    window_frames_max: 90
    name_regex: "(?i)(lean|bend|reach|forward|pickup|stoop|squat|crouch)"

  # Lateral leans (NEW in v6): pure waist_roll synthesis, hard-capped at
