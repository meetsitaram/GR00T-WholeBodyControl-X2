  # the X2 is much tighter than sagittal (foot half-width ~5 cm vs
  # half-length ~12 cm), so magnitudes here are smaller (4 / 7 / 10).
  - name: lean_left_small
    family: static_upper_body
    target_intent: lean_left
    target_magnitude: small
    target_waist_roll_deg: 4.0
    tol_waist_deg: 2.0
