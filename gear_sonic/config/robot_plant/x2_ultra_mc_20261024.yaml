# X2 Ultra actuator plant -- VENDOR MC GAINS, 2026-10-24.
#
# = vendor_20260823 (armature, effort, default pose UNCHANGED) + explicit per-joint PD gains
# (`stiffness`, `damping`) = the gains the vendor's motion controller (MC) commands in STAND_DEFAULT,
# MEASURED from the May MC scan (mc_motor_scan_1778884089.jsonl, x2_scan_mc_motors). A least-squares fit
# effort = kp*(tgt-q) - kd*v on 2026-10-24 confirmed the motors apply the commanded gains (fit/cmd 0.88-0.99).
#
# WHY: the armature convention (kp = armature*(2*pi*10 Hz)^2) made waist pitch/roll and ankle roll
# 2.4-3.2x softer than MC (kp 12.4 vs 40/30). SuperMimic 320k on the robot 2026-10-24: weak waist, no
# leg-posture restoring when nudged (docs/experiments/supermimic_bones_full_v1_eval_findings.md s9).
#
# ACTION SCALE IS UNCHANGED: action_scale = 0.25*effort/(armature*w^2) -- from the ARMATURE kp, never from
# `stiffness` (plant_config.py and plant_loader.hpp both), so a policy trained on vendor_20260823 means the
# same joint targets here and can be fine-tuned. Stiffer gains = more torque per unit target error.
#
# Keys are substrings, FIRST MATCH WINS (specific before general).
name: mc_20261024
natural_freq_hz: 10.0
damping_ratio: 2.0

armature:
  hip: 0.029079810             # PF90
  knee: 0.029079810            # PF90
  waist_yaw: 0.029079810       # PF90 — same motor as hip/knee (was 2.86x low)
  waist_pitch: 0.003132992     # PF52
  waist_roll: 0.003132992      # PF52
  ankle_pitch: 0.008840000     # PF70 — NOT ankle_roll's motor (was 2.45x low)
  ankle_roll: 0.003132992      # PF52
  shoulder_pitch: 0.008840000  # PF70 (was 2.45x low)
  shoulder_roll: 0.008840000   # PF70 (was 2.45x low)
  shoulder_yaw: 0.003132992    # PF52
  elbow: 0.003132992           # PF52
  wrist_yaw: 0.003132992       # PF52
  wrist_pitch: 0.00425         # ESTIMATE — vendor has not supplied wrist/head
  wrist_roll: 0.00425          # ESTIMATE
  head: 0.00425                # ESTIMATE

# Torque ceilings (N.m). PF70 is kept at its NOMINAL 36 rather than the ACTUAL
# 45: over-torquing sim is the dangerous direction — that is precisely what
# waist=48 did ("stable in sim, falls forward on real"). Raise only if the
# deploy/MC clamp is confirmed to pass full motor peak to the joint.
effort:
  hip: 120.0
  knee: 120.0
  waist_yaw: 120.0
  waist_pitch: 24.0            # vendor PF52 (cfg had 36, MJCF had 48)
  waist_roll: 24.0
  ankle_pitch: 36.0
  ankle_roll: 24.0
  shoulder_pitch: 36.0
  shoulder_roll: 36.0
  shoulder_yaw: 24.0
  elbow: 24.0
  wrist_yaw: 24.0
  wrist_pitch: 6.0
  wrist_roll: 6.0
  head_yaw: 2.6
  head_pitch: 0.6

# Default joint positions (rad), the pose actions are offsets FROM. Mirrors
# x2_ultra.py's init_state.joint_pos. Lives here because a stub import cannot
# reach that dict (isaaclab mocked -> init_state is a MagicMock), and because
# eval_x2_mujoco.py kept its own copy -- a FOURTH duplicate of the robot
# definition. Keys are substrings, first match wins; side-specific before
# generic (left_shoulder_roll must beat shoulder_roll).
default_joint_pos:
  left_shoulder_roll: 0.2
  right_shoulder_roll: -0.2
  left_shoulder_pitch: 0.2
  right_shoulder_pitch: 0.2
  hip_pitch: -0.312
  knee: 0.669
  ankle_pitch: -0.363
  elbow: -0.6

# Absolute PD gains (N.m/rad, N.m.s/rad) -- MC STAND_DEFAULT, measured. Override armature*w^2 / 2*zeta*armature*w.
stiffness:
  hip: 100.0
  knee: 150.0
  ankle_pitch: 40.0
  ankle_roll: 30.0
  waist: 40.0
  shoulder_pitch: 30.0
  shoulder_roll: 20.0
  shoulder_yaw: 20.0
  elbow: 50.0
  wrist_yaw: 50.0
  wrist_pitch: 20.0
  wrist_roll: 20.0
  head_yaw: 3.4
  head_pitch: 10.0

damping:
  hip_pitch: 4.0
  hip: 3.0
  knee: 5.0
  ankle_pitch: 3.0
  ankle_roll: 2.0
  waist_yaw: 8.0
  waist: 5.0
  shoulder: 1.0
  elbow: 1.0
  wrist: 1.0
  head_yaw: 0.114
  head_pitch: 0.8
