# Standard policy observations composition, with observation noise ranges
# doubled relative to local_dir_hist.yaml — used by sonic_x2_ultra_demo_v2.
#
# Rationale: the warm-start checkpoint was trained with the level0_4 noise
# levels below × 0.5. Doubling pushes the policy toward a sim2real-grade
# robustness envelope (Lee et al. 2020 / Margolis et al. 2022 ranges).
#
# Identical structure to local_dir_hist.yaml — only the noise n_min / n_max
# values differ. enable_corruption stays True.

defaults:
  - ../terms/gravity_dir@_here_
  - ../terms/base_ang_vel@_here_
  - ../terms/joint_pos@_here_
  - ../terms/joint_vel@_here_
  - ../terms/actions@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.PolicyCfg
enable_corruption: True
concatenate_terms: True


gravity_dir:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.10
    n_max: 0.10

base_ang_vel:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.4
    n_max: 0.4

joint_pos:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.02
    n_max: 0.02

joint_vel:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -1.0
    n_max: 1.0

actions:
  history_length: ${actor_actions_history_length}
