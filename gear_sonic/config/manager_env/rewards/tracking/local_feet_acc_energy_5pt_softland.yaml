# SONIC v1.1 reward composition + our SOFT-LANDING terms.
#
# = upstream local_feet_acc_energy_5pt (v1.1: adds tracking_vr_2wrists_local_ori
#   + energy_consumption)
# + our base_5point_local_feet_acc_softland extras (2026-07-16: touchdown
#   impact-velocity penalty + GRF-overshoot penalty on the feet)
#
# Use this for the X2 legs. Adopting upstream's local_feet_acc_energy_5pt
# directly on X2 would SILENTLY DROP both soft-landing terms -- every X2
# config that warm-starts from a softland checkpoint depends on them, and a
# silently dropped reward term is the class of regression that has forced a
# full restart before.
#
# G1 legs do NOT need this file: the G1 chain never carried softland.

defaults:
  - terms/tracking_anchor_pos@_here_
  - terms/tracking_anchor_ori@_here_
  - terms/tracking_relative_body_pos@_here_
  - terms/tracking_relative_body_ori@_here_
  - terms/tracking_body_linvel@_here_
  - terms/tracking_body_angvel@_here_
  - terms/action_rate_l2@_here_
  - terms/joint_limit@_here_
  - terms/undesired_contacts@_here_
  - terms/anti_shake_ang_vel@_here_
  - terms/tracking_vr_5point_local@_here_
  - terms/tracking_vr_2wrists_local_ori@_here_
  - terms/feet_acc@_here_
  - terms/energy_consumption@_here_
  - terms/feet_impact_vel@_here_
  - terms/feet_grf_overshoot@_here_

_target_: gear_sonic.envs.manager_env.mdp.rewards.RewardsCfg
