# frozen_g1.yaml -- REVISION 8 (2026-08-24).  THE v13 ITERATION FILE.
#
# ===== REVISION 8 (2026-08-24 night) -- RETRACTS REV 7's kd CHANGE =====
# This file is now IDENTICAL to bigrun.yaml.  Both rev6 and rev7 were tested on
# the robot and BOTH were worse than bigrun:
#
#   rev6  target_lpf_hz_waist 3.0   -> waist power in 1-3 Hz went 30->91% (pitch),
#         21->95% (roll); roll noisier than every 25.9 s window of the LPF-off
#         run.  Operator e-stopped in <1 min.  REVERTED in rev7.
#
#   rev7  kd_scale_waist_pr 1.414   -> derived from zeta = kd/(2*sqrt(kp*I)) using
#         I = ARMATURE (0.003133).  THAT IS THE ROTOR INERTIA, NOT THE LOAD.  The
#         waist_pitch joint carries 20.13 kg whose CoM is 15.2 cm off the axis:
#         m*d^2 = 0.468 kg.m^2, at least 149x the armature.  Recomputed on the
#         real load:  kd_scale 5.51 -> zeta 0.64 (sane);  1.414 -> zeta 0.16
#         (severely underdamped).  bigrun's 5.51 was never "over-damped" -- it
#         was empirically correcting a gain formula built on rotor inertia.
#         Robot destabilised from IDLE STAND at t=39 s, tilt 0.8->18.9 deg.
#         RETRACTED here.
#
# LESSON: kp = armature*w^2 / kd = 2*zeta*armature*w set the ROTOR's response.
# Never judge a joint's damping with the armature when the link inertia is
# orders of magnitude larger.  For waist/hip/knee use m*d^2 of the subtree.
#
# STATUS: deploy-side knobs are now swept -- clamp, LPF, kp, kd all tested and
# none fix the v13 waist.  Points back at the policy, consistent with "only
# models trained against the new NVIDIA core fail".
#
#
# ===== REVISION 7 (2026-08-24 night) =====
# = bigrun.yaml with ONE change:  kd_scale_waist_pr 5.51 -> 1.414
#
# (a) target_lpf_hz_waist 3.0 -> 0.0.  REVERTED to bigrun.  Rev 6's 3 Hz filter
#     did not damp the waist, it retuned it: measured on the robot, run 134118
#     (LPF off, 872 s) vs run 153225 (LPF 3 Hz, 25.9 s, same 10:03 binary) --
#     power in the 1-3 Hz band went pitch 30->91%, roll 21->95%, yaw 34->74%,
#     dominant freq 0.38->1.70 / 0.25->1.86 / 0.20->2.13 Hz, and waist roll came
#     out noisier than EVERY 25.9 s window of the pre-LPF run.  Phase lag from a
#     filter in the command path feeding a heavily damped loop = resonance just
#     under the cutoff.  Operator e-stopped in under a minute.
#
# (b) kd_scale_waist_pr 5.51 -> 1.414.  THE ONE NEW VARIABLE.
#     v13 was trained on the vendor plant at zeta = 2.0:
#         kp = armature*w^2      = 12.369    (armature 0.003132992, w = 2*pi*10)
#         kd = 2*zeta*armature*w =  0.787
#     Deployed with kp_scale 2.00 / kd_scale 5.51 that becomes kp 24.737,
#     kd 4.339 -> zeta 7.79, i.e. 5.5x the damping the policy ever saw.  The
#     joint responds far slower than the policy expects, so it over-commands,
#     the joint arrives late, and it overshoots -- a wobble that never settles.
#     1.414 restores zeta = 2.00 while KEEPING the 2.00x stiffness (kp 24.737,
#     kd 1.114).  This is NOT the kp=kd=1.0 attempt that felt weak: stiffness is
#     unchanged, only damping is corrected.
#
# NOTE this is a plant mismatch, not a regression: the demo config (legacy base,
# same scales) had the IDENTICAL zeta 7.79.  p3_8900 absorbed it; v13 does not.
#
#
# Purpose: one file we keep iterating on while chasing the v13 waist behaviour,
# so every experiment is a NAMED DELTA from bigrun.yaml rather than a new
# filename per attempt. bigrun.yaml is never edited -- it stays the
# gantry-verified fallback.
#
# = bigrun.yaml with ONE change:
#     target_lpf_hz_waist:  0.0 -> 3.0
#
# WHY THIS CHANGE. Measured on the robot 2026-08-24 (run 134118, 82 s):
#
#     axis    cmd p2p   measured p2p   at clamp   freq
#     yaw      10.99deg     6.53deg       0.0%    0.12 Hz
#     pitch    51.57deg     7.22deg       0.7%    2.11 Hz
#     roll     51.57deg    12.43deg       2.3%    0.95 Hz
#
# 51.57 deg IS the +-0.45 rad clamp span: the policy drives waist pitch and roll
# RAIL TO RAIL at ~2 Hz while the joint only actually travels 7-12 deg. Operator
# reported it as a wobble, and specifically as pitch/roll -- not yaw.
#
# Root cause is an OVER-COMMAND, not a gain error:
#     waist_pitch action 5.20  x  action_scale 0.4851  =  2.52 rad = 144 deg
#                                       clamp = 0.45 rad =  25.8 deg  -> 5.6x over
# The policy asks for 144 deg of waist lean. `max_target_dev` does not exist in
# training, so in sim the joint limit absorbed it with no penalty and the policy
# never learned to stay in a usable range. On the robot the clamp turns that
# oscillating demand into a square wave. THAT is the wobble.
#
# The waist is the ONLY group with no output filter (legs 16 Hz, global 8 Hz,
# waist 0.0 = off). Filtering it does not reduce the over-command -- it stops the
# clamped output being a 2 Hz square wave. frozen_g1 rev 5 already named this as
# the intended next knob: "If the waist proves twitchy at 10 deg, 3.0 Hz is the
# next knob -- alone."
#
# WHAT REVISION 5 HAD, AND WHY IT IS REVERTED HERE:
#   * action_clip 10.0 -> back to 20.0. Rev 5's own header says halving it
#     "DIVERGES FROM TRAINING" and that its results "must not be compared
#     against runs at action_clip 20". A confound we do not want while
#     measuring one knob.
#   * max_target_dev_waist 0.209 -> back to 0.45. Rev 5 tightened it to 12 deg
#     for blast-radius reasons. Given the 5.6x over-command now measured, a
#     TIGHTER clamp means MORE saturation, not less -- the opposite of the fix.
#
# NOT changed, deliberately: waist_pr gains. They are currently 13% BELOW the
# hand-tuned values (kp 24.74 vs 28.50), i.e. softer, not stiffer. Raising them
# would make the joint track the bad command more faithfully -- wrong direction.
# waist_yaw gains are 2.86x ABOVE tuned and worth revisiting, but yaw is NOT
# where the operator saw the wobble (0% clamp, 0.12 Hz), so it waits its turn.
#
# ONE KNOB AT A TIME. If the wobble persists with the filter on, revert this and
# look elsewhere rather than stacking a second change on top.
# bigrun.yaml -- the big-run model's demo preset (rung 0 of the BIGRUN
# LADDER). walking_soft_kp.yaml with TWO arm-only changes:
#   target_lpf_hz_arm:   8 (global) -> 0.0   (DISABLED, waist precedent)
#   max_target_dev_arm:  1.50       -> 2.00
#
# THE BIGRUN LADDER (2026-08-11, from the deploy-tuning sweep in
# the bigrun deploy-tuning sweep): every damping layer in the old
# chain was sized against weaker models. Sim-measured against 14000:
# trained gains track 11/11 boxing + 6/6 dances with ZERO extra recovery
# steps and lean-recover 40 N shoulder bursts; the soft_kp chain drops
# clips and staggers ~17 extra steps per dance. Command chatter above
# 10 Hz is ~1% of power on every group -- the LPFs guard against noise
# this model no longer emits. The ladder walks the protections back one
# attributable rung at a time; EVERY rung keeps dev clamps + action_clip
# 20 (the slam armor) and the deploy wrist freeze.
#
#   rung 0  bigrun.yaml       arms freed (LPF 0, dev 2.0)      <- DEMO
#   rung 1  bigrun_wide.yaml  + leg/waist dev clamps widened
#           (1.20/0.80) -- sim-verified demo-clean on EVERYTHING at
#           unchanged gains. See its header for the ablation story.
# (A kp/kd-parity ladder was staged 2026-08-11 and FALSIFIED by the
# sweep the same day: gains toward trained under the old clamps got
# monotonically worse; with clamps opened, soft gains equal trained
# gains exactly. The clamps were the whole problem -- see bigrun doc.)
#
# HARDWARE TEST ORDER per rung (the order the historical failures
# appeared): static chest-nudge (listen for the 5-7 Hz ankle ring) ->
# idle stand (waist wobble) -> in-place turns -> one dance -> boxing.
# Anything rings/wobbles -> step back ONE rung (one X2_RITUAL_TUNING
# word). Sim scores per rung: deploy_tuning_sweep.sh, bigrun doc.
#
# Why arms first and free: punch strokes are 3-5 Hz content; the 8 Hz
# arm LPF keeps only 69% of stroke speed (16 Hz keeps 87%) and punch
# targets saturate the 1.50 rad dev clamp on ~10% of samples in CLEAN
# tracking. Arms carry no balance load; in-sweep, freeing them IMPROVED
# survival (boxing 5/11 -> 7/11, gangam dance fall eliminated) -- a
# lagged arm fights the policy's own momentum management. Watch on
# hardware: shoulder/elbow buzz, punch follow-through overshoot.
#
# Legs, waist, head, every kp/kd scale: IDENTICAL to walking_soft_kp.yaml.

description: |
  BIGRUN rung 0 (demo candidate): walking_soft_kp + arm LPF DISABLED +
  arm dev clamp 2.00. Full-fidelity arm strokes for combat/fast dances
  under the big-run model; balance-relevant groups untouched. Ladder
  continues in bigrun_legs_lpf0 / bigrun_parity*.

action_clip:    20.0
max_target_dev:        0.30
max_target_dev_leg:    0.70
max_target_dev_waist:  0.45
max_target_dev_arm:    2.00   # arm change 2 (was 1.50)
max_target_dev_head:   0.50
ramp_seconds:    2.0
return_seconds:  2.0
tilt_cos:       -0.3
target_lpf_hz:        8.0
target_lpf_hz_leg:    16.0
target_lpf_hz_waist:  0.0   # rev7: REVERTED to bigrun (rev6 3.0Hz made it worse)
target_lpf_hz_arm:    0.0    # arm change 1 (was global 8)
kp_scale_ankle_pitch: 1.40
kp_scale_ankle_roll:  1.15
kp_scale_knee:        1.20
kp_scale_waist_yaw:   1.00
kp_scale_waist_pr:    2.00
kd_scale_ankle_pitch: 2.00
kd_scale_ankle_roll:  1.50
kd_scale_knee:        0.792
kd_scale_hip:         0.476
kd_scale_waist_yaw:   1.50
kd_scale_waist_pr:    5.51   # rev8: REVERTED to bigrun. rev7 1.414 was derived from zeta(armature), WRONG inertia.
